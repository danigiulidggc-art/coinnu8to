<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56">
  <title>Giulia Camasso</title>
  <!-- il segno: due lenti sottili unite da un ponte; quella a destra è rosa -->
  <g fill="none" stroke="#2b2326" stroke-width="1.2" stroke-linecap="round">
    <circle cx="20" cy="28" r="15"/>
    <circle cx="58" cy="28" r="15" fill="#f7dde5"/>
    <path d="M34.5 24 Q39 19 43.5 24"/>
  </g>
  <g font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="17" fill="#2b2326" text-anchor="middle">
    <text x="20" y="33.5">G</text>
    <text x="58" y="33.5">C</text>
  </g>
  <!-- il nome -->
  <text x="88" y="35" font-family="'Cormorant Garamond', Georgia, serif" font-size="25" letter-spacing="0.6" fill="#2b2326">Giulia Camasso</text>
</svg>
